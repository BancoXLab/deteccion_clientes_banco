name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build-image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bancox:ci .

      - name: Run Docker container (health check)
        run: |
          docker run -d -p 8000:8000 --name bancox_test bancox:ci
          echo "Esperando 15 segundos para que la app se inicie..."
          sleep 15
          echo "Verificando endpoint /healthz"
          curl -v http://localhost:8000/healthz || (echo "Health check falló"; docker logs bancox_test; exit 1)
          echo ""
          echo "Health check OK ✅"
        shell: bash

      - name: Stop Docker container
        if: always()
        run: docker stop bancox_test
