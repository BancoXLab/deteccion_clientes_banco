version: '3.8'

services:
  fastapi:
    image: bancox:latest
    build: .
    container_name: bancox_api
    ports:
      - "8000:8000"
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - ENV=dev
      - PYTHONPATH=/app

  client:
    image: python:3.12-slim
    container_name: bancox_client
    working_dir: /app
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    command: >
      sh -c "pip install -q -r requirements.lock &&
             python /app/scr/client/client.py"
    depends_on:
      - fastapi

  monitor:
    build: .
    container_name: bancox_monitor
    command: ["/app/venv/bin/python", "/app/scr/ops/monitor.py"]
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      - fastapi
    environment:
      - CONFIG_PATH=/app/config/monitoring.json

  alert-server:
    build: .
    container_name: bancox_alerts
    ports:
      - "9000:9000"
    command: ["/app/venv/bin/python", "/app/scr/ops/alert_server.py"]
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      - monitor

  dashboard:
    build: .
    container_name: bancox_dashboard
    ports:
      - "8501:8501"
    command: ["/app/venv/bin/streamlit", "run", "/app/scr/app/artifacts/monitor_dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      - alert-server
