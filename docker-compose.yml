version: '3.8'

services:
  fastapi:
    image: bancox:latest
    build: .
    container_name: bancox_api
    ports:
      - "8000:8000"
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - ENV=dev
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "/app/venv/bin/python", "-c", "import requests; requests.get('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build: .
    container_name: bancox_client
    working_dir: /app
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    command: ["/app/venv/bin/python", "/app/scr/client/client.py"]
    depends_on:
      fastapi:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - BANCO_X_API_URL=http://bancox_api:8000

  monitor:
    build: .
    container_name: bancox_monitor
    command: ["/app/venv/bin/python", "/app/scr/ops/monitor.py"]
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      fastapi:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/app/config/monitoring.json
      - PYTHONPATH=/app

  alert-server:
    build: .
    container_name: bancox_alerts
    ports:
      - "9000:9000"
    command: ["/app/venv/bin/python", "/app/scr/ops/alert_server.py"]
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      - monitor

  dashboard:
    build: .
    container_name: bancox_dashboard
    ports:
      - "8500:8500"
    command: ["/app/venv/bin/streamlit", "run", "/app/scr/app/artifacts/monitor_dashboard.py", "--server.port=8500", "--server.address=0.0.0.0"]
    volumes:
      - ./scr:/app/scr
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      - alert-server
